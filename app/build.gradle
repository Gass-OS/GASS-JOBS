plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gass.jobs'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gass.jobs'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    buildFeatures {\n        buildConfig true\n    }\n\n    dependencies {\n        implementation 'io.github.webrtc-sdk:android:150.7871.04'\n    }\n\n    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
